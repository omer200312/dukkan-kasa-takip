name: GitHub Pages Yayını

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Paketleri yükle
        run: pnpm install --frozen-lockfile

      - name: React uygulamasını derle
        run: pnpm build

      - name: GitHub Pages'i hazırla
        uses: actions/configure-pages@v5

      - name: Site dosyalarını paketle
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v5
